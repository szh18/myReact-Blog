name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Extract repo name
        id: repo
        run: |
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          echo "name=$REPO_NAME" >> $GITHUB_OUTPUT

      - name: Build
        env:
          BASE_URL: /${{ steps.repo.outputs.name }}/
          VITE_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ steps.repo.outputs.name }}
          VITE_GISCUS_REPO: ${{ secrets.GISCUS_REPO }}
          VITE_GISCUS_REPO_ID: ${{ secrets.GISCUS_REPO_ID }}
          VITE_GISCUS_CATEGORY: ${{ secrets.GISCUS_CATEGORY }}
          VITE_GISCUS_CATEGORY_ID: ${{ secrets.GISCUS_CATEGORY_ID }}
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
